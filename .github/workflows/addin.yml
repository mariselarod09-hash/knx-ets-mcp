name: addin

# Builds the ETS AddIn (net48) for both ETS6 and ETS5.
#
# The KNX ETS SDK DLLs are proprietary and NOT in this repo. CI fetches them from a
# PRIVATE repo (knx-ai/knx-ets-sdk, layout: ets6/ + ets5/) via the SDK_REPO_TOKEN secret
# (a token with read access to that private repo). Without the secret the build is
# skipped (not failed) -- the SDK cannot be exposed via public CI.
#
# The ETS6 build targets the 6.4 SDK and runs on ETS 6.3 and 6.4; the ETS5 build targets
# the 5.7 SDK.

on:
  push:
    branches: [main]
    paths: ['addin/**', '.github/workflows/addin.yml']
  pull_request:
    paths: ['addin/**', '.github/workflows/addin.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for SDK access
        id: sdk
        shell: bash
        run: |
          if [ -n "${{ secrets.SDK_REPO_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SDK_REPO_TOKEN not set - skipping AddIn build (proprietary SDK unavailable)."
          fi

      - name: Checkout private SDK repo
        if: steps.sdk.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: knx-ai/knx-ets-sdk
          token: ${{ secrets.SDK_REPO_TOKEN }}
          path: knx-sdk

      - name: Setup .NET
        if: steps.sdk.outputs.available == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build ETS6 (6.4 SDK -- runs on ETS 6.3 and 6.4)
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: dotnet build addin/*.csproj -c Release "-p:EtsDllPath=$GITHUB_WORKSPACE/knx-sdk/ets6/"

      - name: Build ETS5 (5.7 SDK)
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: dotnet build addin/*.csproj -c Release -p:Ets5=true "-p:EtsDllPath=$GITHUB_WORKSPACE/knx-sdk/ets5/"

      - name: Guard -- fail if proprietary SDK DLLs in build output
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: |
          if find addin/bin/Release/net48/ -iname 'Knx.Ets.*.dll' -o -iname 'Knx*Resources*.dll' | grep -q .; then
            echo "::error::Proprietary KNX SDK DLL leaked into build output!"
            find addin/bin/Release/net48/ -iname 'Knx.Ets.*.dll' -o -iname 'Knx*Resources*.dll'
            exit 1
          fi
          echo "OK -- no proprietary DLLs in build output."

      - name: Upload AddIn artifact
        if: steps.sdk.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: knx-ets-addin
          path: |
            addin/**/bin/Release/net48/Knx.EtsBridge.Addin.dll
            addin/AddInManifest.xml
            addin/install.bat
            addin/install.ps1
            addin/uninstall.bat
          if-no-files-found: error

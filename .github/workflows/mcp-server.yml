name: mcp-server

on:
  push:
    branches: [main]
    paths: ['mcp-server/**', '.github/workflows/mcp-server.yml']
  pull_request:
    paths: ['mcp-server/**', '.github/workflows/mcp-server.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: mcp-server

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Prod runs on Windows next to ETS; tests use the mock transport and are
        # cross-platform, so we cover both.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest -v
        env:
          KNX_BRIDGE_TRANSPORT: mock

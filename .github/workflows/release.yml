name: release

# Tag-driven release. Builds the MCP server (wheel + standalone exe) and the AddIn
# (ETS6 + ETS5), then publishes ONE combined zip (plus wheel/sdist) as release assets.
#
# The AddIn build needs the SDK_REPO_TOKEN secret (read access to the private
# knx-ai/knx-ets-sdk repo; see addin.yml). Without it the AddIn is skipped and the
# combined zip contains only the MCP server.
#
# The AddIn payload folders are signed with the ETS directory signature
# (.sign/sign.py); the signing key is the fixed ETS "converter" RSA key,
# provided via the ETS_CONVERTER_KEY repo secret (the <RSAKeyValue> XML). Without
# it the payload is built UNSIGNED (ETS still runs it, but the folder is not
# treated as signed).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run pytest -v
        env:
          KNX_BRIDGE_TRANSPORT: mock
      - name: Build package
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-server-dist
          path: mcp-server/dist/*

  build-addin:
    runs-on: windows-latest
    outputs:
      built: ${{ steps.sdk.outputs.available }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for SDK access
        id: sdk
        shell: bash
        run: |
          if [ -n "${{ secrets.SDK_REPO_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SDK_REPO_TOKEN not set - AddIn asset will be skipped."
          fi
      - name: Checkout private SDK repo
        if: steps.sdk.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: knx-ai/knx-ets-sdk
          token: ${{ secrets.SDK_REPO_TOKEN }}
          path: knx-sdk
      - name: Setup .NET
        if: steps.sdk.outputs.available == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build ETS6 (6.4 SDK) + ETS5 (5.7 SDK) and package unified zip
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: |
          appid=$(grep -oE 'AppId="[^"]+"' addin/AddInManifest.xml | head -1 | cut -d'"' -f2)
          builddir="addin/bin/Release/net48"
          # ETS6 build (6.4 SDK; runs on ETS 6.3 and 6.4).
          dotnet build addin/*.csproj -c Release "-p:EtsDllPath=$GITHUB_WORKSPACE/knx-sdk/ets6/"
          mkdir -p "out/ets6/$appid"
          cp "$builddir/Knx.EtsBridge.Addin.dll" "out/ets6/$appid/"   # single self-contained DLL
          cp addin/AddInManifest.xml "out/ets6/$appid/"; cp addin/icon.png "out/ets6/$appid/"
          # ETS5 build (5.7 SDK) -- its own manifest.
          dotnet build addin/*.csproj -c Release -p:Ets5=true "-p:EtsDllPath=$GITHUB_WORKSPACE/knx-sdk/ets5/"
          mkdir -p "out/ets5/$appid"
          cp "$builddir/Knx.EtsBridge.Addin.dll" "out/ets5/$appid/"
          cp addin/AddInManifest.ets5.xml "out/ets5/$appid/AddInManifest.xml"; cp addin/icon.png "out/ets5/$appid/"
          # Smart installer picks the right payload per installed ETS version.
          # install.bat is a thin launcher for the readable install.ps1 (with a guard that
          # prints "extract first" if run from inside the zip). uninstall.bat is self-contained.
          cp addin/install.bat addin/install.ps1 addin/uninstall.bat out/
      - name: Guard -- fail if proprietary SDK DLLs leaked into package
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: |
          if find out/ -iname 'Knx.Ets.*.dll' -o -iname 'Knx*Resources*.dll' | grep -q .; then
            echo "::error::Proprietary KNX SDK DLL leaked into packaged output!"
            find out/ -iname 'Knx.Ets.*.dll' -o -iname 'Knx*Resources*.dll'
            exit 1
          fi
          echo "OK -- no proprietary DLLs in package."
      - name: Upload AddIn payload (assembled into the combined zip by the release job)
        if: steps.sdk.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: addin-payload
          path: out/**
          if-no-files-found: error

  build-exe:
    # Standalone knx-ets-mcp.exe (bundles the Python runtime) so the MCP server
    # runs on a plain Windows machine without a separate Python install.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          # "mcp[cli]" pulls typer etc. so PyInstaller's --collect-all mcp can import
          # the (unused) mcp.cli submodule during submodule enumeration.
          pip install . pyinstaller "mcp[cli]"
      - name: Install UPX (PyInstaller uses it to shrink the exe)
        shell: bash
        run: choco install upx -y --no-progress
      - name: Build standalone exe
        # PyInstaller auto-detects UPX on PATH and compresses the bundle (~40-50% smaller).
        run: >
          pyinstaller --onefile --name knx-ets-mcp
          --icon packaging/icon.ico
          --collect-all fastmcp --collect-all mcp
          --collect-all pydantic --collect-all pydantic_core
          packaging/pyi_entry.py
      - uses: actions/upload-artifact@v7
        with:
          name: knx-ets-mcp-exe
          path: mcp-server/dist/knx-ets-mcp.exe
          if-no-files-found: error

  release:
    needs: [build-mcp, build-addin, build-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble combined release payload pkg/ (AddIn + MCP server exe + wheel)
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          payload="$(dirname "$(find artifacts -name uninstall.bat | head -1)")"   # AddIn payload root
          exe="$(find artifacts -name 'knx-ets-mcp.exe' | head -1)"
          whl="$(find artifacts -name '*.whl' | head -1)"
          mkdir -p pkg
          if [ -n "$payload" ] && [ -d "$payload" ]; then
            cp -r "$payload"/* pkg/          # ets6/, ets5/, install.bat, uninstall.bat
            # Entry point is deliberately named exactly "install.bat": WinZip's
            # "Unzip and Install" feature recognizes a program named setup/install and
            # extracts the WHOLE archive to temp before running it (so the ets6/ets5
            # payload is present). A numbered/prefixed name breaks that recognition.
            # The native Explorer zip handler extracts only the single clicked file
            # regardless of name -- there the inline guard tells the user to extract first.
          else
            echo "::warning::No AddIn payload (SDK secret missing?) - zip will contain only the MCP server."
          fi
          # MCP server exe in the root, plain name (no spaces).
          [ -n "$exe" ] && cp "$exe" "pkg/Start-MCP-Server.exe"
          # Python wheel (pip alternative) kept in a subfolder to keep the root clean.
          if [ -n "$whl" ]; then mkdir -p pkg/mcp-server-python; cp "$whl" pkg/mcp-server-python/; fi
      - name: Sign AddIn payload folders (ETS directory signature)
        # Signs the FINAL payload copy in pkg/ immediately before it is zipped, so the
        # signed bytes are exactly the shipped bytes. Each <AppId> folder gets an
        # <AppId>.signature next to it (in ets6/ and ets5/); the zip step below runs
        # after this so the .signature files are inside the archive. Best-effort:
        # without the ETS_CONVERTER_KEY secret the payload ships unsigned (ETS still
        # runs it, but flags the folder as not signed).
        shell: bash
        env:
          ETS_CONVERTER_KEY: ${{ secrets.ETS_CONVERTER_KEY }}
        run: |
          if [ ! -d pkg/ets6 ] && [ ! -d pkg/ets5 ]; then
            echo "No AddIn payload to sign."
            exit 0
          fi
          if [ -z "$ETS_CONVERTER_KEY" ]; then
            echo "::warning::ETS_CONVERTER_KEY secret not set - AddIn payload folders will be UNSIGNED."
            exit 0
          fi
          python3 -m venv .sign/venv
          .sign/venv/bin/pip install -q pyuca
          signed=0
          # AppId folder names are fixed-format (no spaces/newlines), so a plain
          # newline-separated find is safe here.
          while IFS= read -r manifest; do
            app="$(dirname "$manifest")"
            echo "=== signing $app ==="
            .sign/venv/bin/python .sign/sign.py "$app"
            .sign/venv/bin/python .sign/sign.py "$app" --check
            signed=$((signed + 1))
          done < <(find pkg/ets6 pkg/ets5 -maxdepth 2 -type f -name AddInManifest.xml 2>/dev/null)
          echo "=== signature files in pkg/ ($signed folders signed) ==="
          find pkg -name '*.signature'
      - name: Zip signed payload + MCP server into one release archive
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # Zip AFTER signing so the .signature files are inside the archive.
          (cd pkg && zip -r "../knx-ets-mcp-$tag.zip" .)
          echo "=== combined zip contents ==="; unzip -l "knx-ets-mcp-$tag.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # One combined zip (AddIn + installer + MCP server exe + wheel). The wheel and
          # sdist are also attached for users who prefer pip. No standalone .exe asset --
          # it lives inside the combined zip.
          files: |
            knx-ets-mcp-*.zip
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
          generate_release_notes: true
